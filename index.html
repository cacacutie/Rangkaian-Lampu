<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Rangkaian Listrik Praktikum</title>
    <style>
        body { font-family: 'Times New Roman'; padding: 20px; }
        .rangkaian { margin-bottom: 30px; border-bottom: 2px solid pink; padding-bottom: 20px; }
        img { margin: 5px; }
        button { margin: 5px; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

<h1>Rangkaian Listrik</h1>

<div class="rangkaian">
    <h3>Rangkaian 1</h3>
    <img id="l1" src="off.png" width="100">
    <img id="l2" src="off.png" width="100">
    <img id="l3" src="off.png" width="100">
    <br><br>
    <button onclick="satuPersatu1()">Klik 1 - Satu Persatu</button>
    <button onclick="semuaLampu1()">Klik 2 - Semua Lampu</button>
</div>

<div class="rangkaian">
    <h3>Rangkaian 2</h3>
    <img id="lA" src="off.png" width="100">
    <img id="lB" src="off.png" width="100">
    <img id="lC" src="off.png" width="100">
    <img id="lD" src="off.png" width="100">
    <br><br>
    <button onclick="satuPersatu2()">Klik 1 - Satu Persatu</button>
    <button onclick="semuaLampu2()">Klik 2 - Semua Lampu</button>
    <button onclick="grupLampu()">Klik 3 - Grup (A,B) & (C,D)</button>
</div>

<script>
    let urutan1 = 0;

    function satuPersatu1() {
        const ids1 = ['l1', 'l2', 'l3'];
        if (document.getElementById(ids1[urutan1]).src.includes('off.png')) {
            document.getElementById(ids1[urutan1]).src = 'on.png';
        } else {
            document.getElementById(ids1[urutan1]).src = 'off.png';
        }
        urutan1 = (urutan1 + 1) % 3;
    }

    function semuaLampu1() {
        const ids1 = ['l1', 'l2', 'l3'];
        let target = document.getElementById('l1').src.includes('off.png') ? 'on.png' : 'off.png';
        ids1.forEach(id => document.getElementById(id).src = target);
    }

    let urutan2 = 0;

    function satuPersatu2() {
        const ids2 = ['lA', 'lB', 'lC', 'lD'];
        if (document.getElementById(ids2[urutan2]).src.includes('off.png')) {
            document.getElementById(ids2[urutan2]).src = 'on.png';
        } else {
            document.getElementById(ids2[urutan2]).src = 'off.png';
        }
        urutan2 = (urutan2 + 1) % 4;
    }

    function semuaLampu2() {
        const ids2 = ['lA', 'lB', 'lC', 'lD'];
        let target = document.getElementById('lA').src.includes('off.png') ? 'on.png' : 'off.png';
        ids2.forEach(id => document.getElementById(id).src = target);
    }

    let g = 0;

    function grupLampu() {
        const ab = ['lA', 'lB'];
        const cd = ['lC', 'lD'];
        if (g == 0) {
            ab.forEach(id => document.getElementById(id).src = 'on.png');
            cd.forEach(id => document.getElementById(id).src = 'off.png');
            g = 1;
        } else if (g == 1) {
            ab.forEach(id => document.getElementById(id).src = 'off.png');
            cd.forEach(id => document.getElementById(id).src = 'on.png');
            g = 2;
        } else {
            ab.forEach(id => document.getElementById(id).src = 'off.png');
            cd.forEach(id => document.getElementById(id).src = 'off.png');
            g = 0;
        }
    }
</script>

<style>
    body { background-color: #fffde7; }
</style>

</body>
</html>
